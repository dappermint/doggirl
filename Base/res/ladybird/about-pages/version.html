<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="light dark" />
        <title>About Doggirl</title>
        <link rel="icon" type="image/png" href="resource://icons/48x48/app-browser.png" />
        <link rel="stylesheet" type="text/css" href="resource://ladybird/ladybird.css" />
        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                box-sizing: border-box;
                padding: 100px 24px 26px;
            }

            .paw-stage {
                position: relative;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .logomark-button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 4px;
                border: none;
                border-radius: 28px;
                background: transparent;
                cursor: pointer;
                transition: transform 120ms ease;
            }

            .logomark-button:hover {
                transform: scale(1.03);
            }

            .logomark-button:active {
                transform: scale(0.95);
            }

            .logomark-button:focus-visible {
                outline: 2px solid var(--link);
                outline-offset: 6px;
            }

            .logomark {
                width: 152px;
                height: 140px;
                display: block;
            }

            .paw-toe-blue {
                fill: url(#paw-blue-light);
            }

            .paw-toe-pink {
                fill: url(#paw-pink-light);
            }

            .paw-main {
                fill: url(#paw-main-light);
                stroke: url(#paw-rim-light);
                stroke-width: 12;
            }

            @media (prefers-color-scheme: dark) {
                .paw-toe-blue {
                    fill: url(#paw-blue-dark);
                }

                .paw-toe-pink {
                    fill: url(#paw-pink-dark);
                }

                .paw-main {
                    fill: url(#paw-main-dark);
                    stroke: none;
                }
            }

            @keyframes paw-bark {
                0% {
                    transform: scale(1) rotate(0deg);
                }
                22% {
                    transform: scale(1.12) rotate(-8deg);
                }
                52% {
                    transform: scale(1.06) rotate(7deg);
                }
                78% {
                    transform: scale(0.98) rotate(-3deg);
                }
                100% {
                    transform: scale(1) rotate(0deg);
                }
            }

            .logomark-button.is-barking .logomark {
                animation: paw-bark 340ms cubic-bezier(0.22, 1, 0.36, 1);
            }

            .woof-bubble {
                position: absolute;
                top: -12px;
                right: -28px;
                padding: 4px 10px;
                border-radius: 999px;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.01em;
                color: #242130;
                background: linear-gradient(135deg, #9de6ff, #ffccd9);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
                opacity: 0;
                visibility: hidden;
                transform: translateY(6px) scale(0.86);
                pointer-events: none;
                transition:
                    opacity 160ms ease,
                    transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0ms linear 160ms;
            }

            .woof-bubble.visible {
                opacity: 1;
                visibility: visible;
                transform: translateY(-4px) scale(1);
                transition:
                    opacity 160ms ease,
                    transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
                    visibility 0ms linear 0ms;
            }

            @media (prefers-reduced-motion: reduce) {
                .logomark-button,
                .woof-bubble {
                    transition: none;
                }

                .logomark-button.is-barking .logomark {
                    animation: none;
                }
            }

            .name {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 26px;
            }

            h1 {
                font-size: 40px;
                font-weight: 600;
                letter-spacing: -0.025em;
                line-height: 1;
            }

            .badge {
                margin-top: 2px;
                font-size: 12px;
                font-weight: 600;
                padding: 3px 8px;
                border-radius: 6px;
                color: var(--badge-text);
                background: var(--badge-background);
            }

            .tagline {
                margin-top: 10px;
                font-size: 15px;
                color: var(--muted);
            }

            .details {
                width: 100%;
                max-width: 460px;
                margin-top: 30px;
                padding: 14px 16px 14px 18px;
                box-sizing: border-box;
                border-radius: 8px;
                background: var(--page);
                box-shadow: inset 0 0 0 1px var(--separator);
            }

            .summary {
                display: flex;
                align-items: flex-start;
                gap: 12px;
            }

            .details dl {
                flex: 1;
                display: grid;
                grid-template-columns: 96px minmax(0, 1fr);
                row-gap: 8px;
                font-size: 13px;
                line-height: 1.4;
            }

            .details dt {
                color: var(--muted);
            }

            .details dd {
                overflow-wrap: anywhere;
            }

            .links {
                display: flex;
                gap: 16px;
                margin-top: 14px;
                padding-top: 12px;
                border-top: 1px solid var(--separator);
                font-size: 13px;
            }

            .links a {
                color: var(--link);
                text-decoration: none;
            }

            .links a:hover {
                text-decoration: underline;
            }

            .copy {
                display: flex;
                align-items: center;
                gap: 6px;
                height: 28px;
                padding: 0 10px;
                border: none;
                border-radius: 7px;
                font: inherit;
                font-size: 13px;
                color: var(--text);
                background: var(--control);
                cursor: pointer;
            }

            .copy:hover {
                background: var(--control-hover);
            }

            .copy:active {
                background: var(--control-pressed);
            }

            .copy svg {
                width: 12px;
                height: 12px;
            }
        </style>
    </head>
    <body>
        <div class="paw-stage">
            <button class="logomark-button" id="about-paw" type="button" aria-label="Doggirl paw logomark">
                <svg class="logomark" viewBox="140 164 744 680" role="img" aria-hidden="true">
                    <defs>
                        <linearGradient id="paw-blue-light" x1="0.2" y1="0" x2="0.8" y2="1">
                            <stop offset="0%" stop-color="#89DDFC" />
                            <stop offset="100%" stop-color="#5BC5F2" />
                        </linearGradient>
                        <linearGradient id="paw-pink-light" x1="0.2" y1="0" x2="0.8" y2="1">
                            <stop offset="0%" stop-color="#FBC0D0" />
                            <stop offset="100%" stop-color="#F29BB5" />
                        </linearGradient>
                        <linearGradient id="paw-main-light" x1="0" y1="0.15" x2="1" y2="0.9">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="55%" stop-color="#FDFBFE" />
                            <stop offset="100%" stop-color="#F3EEF9" />
                        </linearGradient>
                        <linearGradient id="paw-rim-light" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#7AD6FA" />
                            <stop offset="50%" stop-color="#F5AFC4" />
                            <stop offset="100%" stop-color="#7AD6FA" />
                        </linearGradient>
                        <linearGradient id="paw-blue-dark" x1="0.2" y1="0" x2="0.8" y2="1">
                            <stop offset="0%" stop-color="#9DE6FF" />
                            <stop offset="100%" stop-color="#69CEF8" />
                        </linearGradient>
                        <linearGradient id="paw-pink-dark" x1="0.2" y1="0" x2="0.8" y2="1">
                            <stop offset="0%" stop-color="#FFCCD9" />
                            <stop offset="100%" stop-color="#F6A4BC" />
                        </linearGradient>
                        <linearGradient id="paw-main-dark" x1="0" y1="0.1" x2="1" y2="0.95">
                            <stop offset="0%" stop-color="#FFFFFF" />
                            <stop offset="55%" stop-color="#F8F5FC" />
                            <stop offset="100%" stop-color="#EAE5F5" />
                        </linearGradient>
                    </defs>
                    <ellipse class="paw-toe-blue" cx="256" cy="446" rx="76" ry="108" transform="rotate(-24 256 446)" />
                    <ellipse class="paw-toe-pink" cx="416" cy="312" rx="80" ry="116" transform="rotate(-8 416 312)" />
                    <ellipse class="paw-toe-pink" cx="608" cy="312" rx="80" ry="116" transform="rotate(8 608 312)" />
                    <ellipse class="paw-toe-blue" cx="768" cy="446" rx="76" ry="108" transform="rotate(24 768 446)" />
                    <path
                        class="paw-main"
                        d="M512 464 C582 464, 636 522, 682 592 C726 660, 740 738, 688 786 C646 824, 582 800, 538 784 C521 778, 503 778, 486 784 C442 800, 378 824, 336 786 C284 738, 298 660, 342 592 C388 522, 442 464, 512 464 Z"
                    />
                </svg>
            </button>
            <span class="woof-bubble" id="woof-bubble" aria-live="polite" aria-hidden="true">woof!</span>
        </div>
        <div class="name">
            <h1 id="browser-name">Doggirl</h1>
            <span class="badge" id="release-stage" hidden></span>
        </div>
        <p class="tagline">A fast, independent web browser.</p>
        <div class="details">
            <div class="summary">
                <dl>
                    <dt>Version</dt>
                    <dd id="browser-version"></dd>
                    <dt>Built</dt>
                    <dd id="browser-commit"></dd>
                    <dt>Platform</dt>
                    <dd id="platform"></dd>
                </dl>
                <button class="copy" id="copy" type="button">
                    <svg
                        viewBox="0 0 16 16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M5.5 5.5h7v8h-7zM3.5 10.5v-8h7" />
                    </svg>
                    Copy
                </button>
            </div>
            <div class="links">
                <a href="https://github.com/dappermint/doggirl" target="_blank">GitHub</a>
                <a href="https://github.com/dappermint/doggirl/issues" target="_blank">Issues</a>
                <a href="about:licenses" target="_blank">Licenses</a>
            </div>
        </div>
        <script type="module">
            const copyButton = document.querySelector("#copy");
            const pawButton = document.querySelector("#about-paw");
            const woofBubble = document.querySelector("#woof-bubble");
            const BARK_SOUND_URL = "resource://ladybird/about-pages/bark.wav";
            const BARK_UNLOCK_CLICKS = 5;
            let detailsText = "";
            let pawClicks = 0;
            let audioContext = null;
            let barkBufferPromise = null;
            let woofTimer = null;

            async function playBarkSound() {
                const pitch = 0.88 + Math.random() * 0.24;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        if (!audioContext) audioContext = new AudioCtx();
                        if (audioContext.state === "suspended") await audioContext.resume();
                        if (!barkBufferPromise) {
                            barkBufferPromise = fetch(BARK_SOUND_URL)
                                .then(response => {
                                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                                    return response.arrayBuffer();
                                })
                                .then(data => audioContext.decodeAudioData(data));
                        }
                        const buffer = await barkBufferPromise;
                        const source = audioContext.createBufferSource();
                        source.buffer = buffer;
                        source.playbackRate.value = pitch;
                        source.connect(audioContext.destination);
                        source.start(0);
                        return;
                    }
                } catch {
                    barkBufferPromise = null;
                }

                try {
                    const audio = new Audio(BARK_SOUND_URL);
                    audio.preservesPitch = false;
                    audio.playbackRate = pitch;
                    await audio.play();
                } catch {}
            }

            pawButton.addEventListener("click", () => {
                pawClicks += 1;
                if (pawClicks < BARK_UNLOCK_CLICKS) return;

                pawButton.classList.remove("is-barking");
                void pawButton.offsetWidth;
                pawButton.classList.add("is-barking");

                woofBubble.setAttribute("aria-hidden", "false");
                woofBubble.classList.add("visible");
                if (woofTimer !== null) clearTimeout(woofTimer);
                woofTimer = setTimeout(() => {
                    woofBubble.classList.remove("visible");
                    woofBubble.setAttribute("aria-hidden", "true");
                    woofTimer = null;
                }, 900);

                void playBarkSound();
            });

            function renderVersionInfo(versionInfo) {
                document.title = `About ${versionInfo.productName}`;
                document.querySelector("#browser-name").innerText = versionInfo.browserName;
                const stageBadge = document.querySelector("#release-stage");
                const stageText = versionInfo.releaseStage || (versionInfo.isReleaseBuild ? "" : "Development");
                stageBadge.innerText = stageText;
                stageBadge.hidden = stageText.length === 0;
                document.querySelector("#browser-version").innerText = versionInfo.browserVersion;
                document.querySelector("#browser-commit").innerText = `from ${versionInfo.browserCommit.slice(0, 10)}`;
                document.querySelector("#platform").innerText = `${versionInfo.platformName}, ${versionInfo.arch}`;

                // What is copied includes the details a bug report needs beyond what the page shows.
                detailsText = [
                    `${versionInfo.productName} ${versionInfo.browserVersion} (${versionInfo.browserCommit})`,
                    `Platform: ${versionInfo.platformName}, ${versionInfo.arch}`,
                    `User agent: ${navigator.userAgent}`,
                    `Command line: ${versionInfo.commandLine}`,
                    `Executable path: ${versionInfo.executablePath}`,
                ].join("\n");
            }

            copyButton.addEventListener("click", () => {
                navigator.clipboard.writeText(detailsText);
            });

            document.addEventListener("WebUILoaded", () => {
                ladybird.sendMessage("loadVersionInfo");
            });

            document.addEventListener("WebUIMessage", event => {
                if (event.detail.name === "renderVersionInfo") {
                    renderVersionInfo(event.detail.data);
                }
            });
        </script>
    </body>
</html>
